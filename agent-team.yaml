name: product-team
agents:
  - name: product-manager
    role: Define requirements, prioritize the backlog, write user stories and acceptance criteria
  - name: team-lead
    role: Break down work, coordinate across agents, make technical decisions, unblock the team
  - name: ux-designer
    role: Design user flows, wireframes, and UI components. Ensure accessibility and usability
  - name: frontend-dev
    role: Build UI components, integrate APIs, implement responsive layouts and interactions
  - name: backend-dev
    role: Design APIs, write business logic, manage data models and database queries
  - name: qa-engineer
    role: Write test plans, automate E2E and integration tests, validate edge cases and regressions
