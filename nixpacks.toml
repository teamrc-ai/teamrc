# Nixpacks configuration for Coolify deployment
# Base directory is repo root so we can access templates/

providers = ["elixir"]

[phases.setup]
nixPkgs = ["elixir", "curl"]

[phases.install]
cmds = ["cd teamrc && mix local.hex --force && mix local.rebar --force && mix deps.get --only prod"]

[phases.build]
cmds = [
  "cd teamrc && mix compile",
  "cd teamrc && mix assets.deploy",
  "cd teamrc && mix release",
  "cp -r teamrc/_build/prod/rel/teamrc/* /app/",
  "cp -r templates /app/templates",
]

[start]
cmd = "/app/bin/migrate && /app/bin/server"

[variables]
MIX_ENV = "prod"
