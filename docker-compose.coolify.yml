# Coolify deployment — deploy as a Docker Compose resource.
# Coolify auto-generates SERVICE_PASSWORD_* and SERVICE_FQDN_* variables.
# For local dev, use docker-compose.yml instead.
#
# IMPORTANT: Your standalone Postgres resource must have "Connect to
# Predefined Network" enabled in Coolify so that both the app and
# database are on the same `coolify` network.

services:
  app:
    build: .
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      update_config:
        order: start-first
    environment:
      # --- Required: Database ---
      # Set DATABASE_URL in Coolify's Environment Variables tab.
      # Use the Internal URL from your Postgres resource, converted to ecto://.
      # Example: ecto://teamrc:password@teamrc-db-xxxx:5432/teamrc
      DATABASE_URL: ${DATABASE_URL:-ecto://teamrc:password@teamrc-db-xxxx:5432/teamrc}
      DATABASE_SSL: "false"

      # --- Required: App ---
      PHX_HOST: ${SERVICE_FQDN_APP:-localhost}
      PHX_SERVER: "true"
      POOL_SIZE: ${POOL_SIZE:-10}

      # --- Required: Secrets (auto-generated by Coolify) ---
      SECRET_KEY_BASE: ${SERVICE_PASSWORD_64_SECRETKEY}
      SESSION_SIGNING_SALT: ${SERVICE_PASSWORD_64_SESSIONSALT}
      LIVE_VIEW_SIGNING_SALT: ${SERVICE_PASSWORD_64_LVSALT}
      SESSION_ENCRYPTION_SALT: ${SERVICE_PASSWORD_64_ENCSALT}

      # --- Optional: Admin dashboard (set in Coolify env vars) ---
      # Comma-separated emails that can access /admin/dashboard
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # --- Optional: BEAM tuning ---
      ERL_FLAGS: "+K true +Q 65536 +P 1048576 +A 32 +sbwt none +sbwtdcpu none +sbwtdio none"

      # --- Optional: Email (set in Coolify env vars) ---
      RESEND_API_KEY: ${RESEND_API_KEY:-}

      # --- Optional: OAuth (set in Coolify env vars) ---
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    networks:
      - default
      - coolify

networks:
  coolify:
    external: true
