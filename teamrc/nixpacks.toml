# Nixpacks configuration for Coolify deployment
# Base directory in Coolify should be set to: /teamrc

[phases.setup]
nixPkgs = ["elixir_1_18", "erlang_27", "gcc", "curl", "git"]
nixLibs = ["stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "mix local.hex --force",
  "mix local.rebar --force",
  "mix deps.get --only prod",
]

[phases.build]
dependsOn = ["install"]
cmds = [
  "mix deps.compile",
  "mix compile",
  "mix assets.deploy",
  "mix release",
  "cp -r _build/prod/rel/teamrc/* /app/",
  "cp -r ../templates /app/templates",
]

[start]
cmd = "/app/bin/migrate && /app/bin/server"

[variables]
MIX_ENV = "prod"
