# docker compose up --build — starts Postgres + teamrc in dev mode
# No SSL, emails logged locally at /dev/mailbox, debug errors enabled.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: teamrc
      POSTGRES_PASSWORD: teamrc
      POSTGRES_DB: teamrc_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamrc"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_HOST: db
      DATABASE_USER: teamrc
      DATABASE_PASS: teamrc
      DATABASE_NAME: teamrc_dev

volumes:
  pgdata:
