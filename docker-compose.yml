# docker compose up — starts Postgres + teamrc relay server
# Runs migrations automatically on startup.
# All secrets are preset for local development. For production, use the Coolify guide.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: teamrc
      POSTGRES_PASSWORD: teamrc
      POSTGRES_DB: teamrc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamrc"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "ecto://teamrc:teamrc@db/teamrc"
      DATABASE_SSL: "false"
      SECRET_KEY_BASE: "dev-only-secret-key-base-do-not-use-in-production-aaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      PHX_HOST: "${PHX_HOST:-localhost}"
      PHX_SERVER: "true"
      PORT: "4000"
      SESSION_SIGNING_SALT: "dev-session-signing-salt"
      LIVE_VIEW_SIGNING_SALT: "dev-live-view-signing-salt"
      SESSION_ENCRYPTION_SALT: "dev-session-encryption-salt"

volumes:
  pgdata:
